{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}SLMS{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { background:#f4f7ff; min-height:100vh; display:flex; }
/* Sidebar */
.sidebar {
    width:280px; background:linear-gradient(180deg,#4f46e5,#6d28d9); color:white;
    padding:30px 20px; position:fixed; height:100vh; box-shadow:0 10px 30px rgba(0,0,0,.2);
    transition: width 0.3s; z-index: 1000; overflow-x: hidden;
}
.sidebar.collapsed { width: 80px; }
.logo { text-align:center; margin-bottom:40px; transition: 0.3s; }
.logo h2 { font-size:32px; font-weight:800; transition: 0.3s; }
.sidebar.collapsed .logo h2 { font-size: 20px; }
.logo p { font-size:13px; opacity:.8; transition: 0.3s; }
.sidebar.collapsed .logo p { display: none; }
.menu { margin-top:20px; }
.menu a {
    display:flex; align-items:center; gap:15px; text-decoration:none; color:white;
    padding:15px 18px; border-radius:12px; margin-bottom:12px; transition:.4s; white-space: nowrap;
}
.menu a:hover { background:rgba(255,255,255,.15); transform:translateX(8px); }
.menu i { font-size:18px; min-width: 25px; text-align: center; }
.sidebar.collapsed .menu span { display: none; }
.sidebar.collapsed .menu a:hover { transform: translateX(5px); }

/* Main Content */
.main {
    margin-left:280px; width:100%; padding:40px; transition: margin-left 0.3s; position: relative;
}
.main.collapsed { margin-left: 80px; }

/* Toggle Button */
.toggle-sidebar-btn {
    position: absolute; top: 20px; left: -15px; width: 30px; height: 30px;
    background: #4f46e5; color: white; border: none; border-radius: 50%;
    cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1001;
    display: flex; align-items: center; justify-content: center; transition: 0.3s;
}
.toggle-sidebar-btn:hover { background: #372fc9; transform: scale(1.1); }
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="logo"><h2>SLMS</h2><p>Admin Panel</p></div>
    <div class="menu">
        <a href="{% url 'admin_dashboard' %}"><i class="fas fa-house"></i><span>Dashboard</span></a>
        <a href="{% url 'leave_request' %}"><i class="fas fa-file-signature"></i><span>Leave Requests</span></a>
        <a href="{% url 'manage_staff' %}"><i class="fas fa-users"></i><span>Manage Staff</span></a>
        <a href="{% url 'reports' %}"><i class="fas fa-chart-column"></i><span>Reports</span></a>
        <a href="{% url 'logout' %}"><i class="fas fa-right-from-bracket"></i><span>Logout</span></a>
    </div>
</div>
<div class="main" id="main-content">
    <button class="toggle-sidebar-btn" id="toggle-btn" onclick="toggleSidebar()"><i class="fas fa-chevron-left" id="toggle-icon"></i></button>
    {% block content %}{% endblock %}
</div>
<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const main = document.getElementById('main-content');
        const icon = document.getElementById('toggle-icon');
        sidebar.classList.toggle('collapsed');
        main.classList.toggle('collapsed');
        if (sidebar.classList.contains('collapsed')) {
            icon.classList.remove('fa-chevron-left');
            icon.classList.add('fa-chevron-right');
            localStorage.setItem('sidebar_collapsed', 'true');
        } else {
            icon.classList.remove('fa-chevron-right');
            icon.classList.add('fa-chevron-left');
            localStorage.setItem('sidebar_collapsed', 'false');
        }
    }
    
    // Check local storage on load
    document.addEventListener("DOMContentLoaded", function() {
        if (localStorage.getItem('sidebar_collapsed') === 'true') {
            document.getElementById('sidebar').classList.add('collapsed');
            document.getElementById('main-content').classList.add('collapsed');
            document.getElementById('toggle-icon').classList.remove('fa-chevron-left');
            document.getElementById('toggle-icon').classList.add('fa-chevron-right');
        }
    });
</script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
